[build]
  command = "cd mujtaba-designer-store && npm install && npm run build"
  publish = "mujtaba-designer-store/dist"
  functions = "mujtaba-designer-store/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
